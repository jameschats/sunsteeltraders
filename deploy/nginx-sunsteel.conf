# Installed once by deploy.sh (never overwritten, so certbot's TLS edits survive releases).
# TLS:  certbot --nginx -d __DOMAIN__ -d www.__DOMAIN__

# Micro-cache for server-rendered public HTML (Core Web Vitals: FCP 0.8 s / LCP 1.8 s targets).
# 60 s is short enough that stock-board and admin edits appear within a minute.
proxy_cache_path /var/cache/nginx/sunsteel levels=1:2 keys_zone=sst_html:10m max_size=200m inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 100m;   # Media:MaxVideoBytes is 80 MB

    location /api/ {
        proxy_pass http://127.0.0.1:5290;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/www/sunsteel/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Admin is client-rendered and private: never cached.
    location /admin {
        proxy_pass http://127.0.0.1:4130;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_cache sst_html;
        proxy_cache_valid 200 301 404 60s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://127.0.0.1:4130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
